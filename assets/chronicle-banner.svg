<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0a0f24"/>
      <stop offset="100%" stop-color="#03050c"/>
    </linearGradient>
    
    <radialGradient id="glow-cyan" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-purple" cx="70%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="shield-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="380" rx="16" fill="url(#grid)"/>
  
  <!-- Glowing Atmospheric Orbs -->
  <circle cx="360" cy="180" r="280" fill="url(#glow-cyan)"/>
  <circle cx="840" cy="180" r="280" fill="url(#glow-purple)"/>

  <!-- Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="377" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Brand Central Icon: Cybernetic Shield & Quantum Rings -->
  <g transform="translate(140, 190)">
    <!-- Outer Orbit Ring -->
    <ellipse cx="0" cy="0" rx="72" ry="72" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 8" stroke-opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="0" cy="0" rx="84" ry="40" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.3" transform="rotate(25)"/>
    <ellipse cx="0" cy="0" rx="84" ry="40" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.3" transform="rotate(-25)"/>

    <!-- Shield Aura Glow -->
    <path d="M 0 -48 L 38 -28 L 38 18 C 38 42 0 58 0 58 C 0 58 -38 42 -38 18 L -38 -28 Z" fill="#06b6d4" fill-opacity="0.15" filter="url(#blur-glow)"/>

    <!-- Core Shield Geometry -->
    <path d="M 0 -46 L 36 -27 L 36 17 C 36 40 0 55 0 55 C 0 55 -36 40 -36 17 L -36 -27 Z" fill="#0a1226" stroke="url(#shield-stroke)" stroke-width="2.5"/>

    <!-- Inner Keyhole / Zero-Trust Monad Symbol -->
    <circle cx="0" cy="-6" r="10" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M -5 0 L 5 0 L 7 20 L -7 20 Z" fill="#38bdf8" fill-opacity="0.9"/>
    <circle cx="0" cy="-6" r="4" fill="#ffffff"/>
  </g>

  <!-- Typography & Brand Text -->
  <g transform="translate(280, 0)">
    <!-- Top Pill Tag -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="280" height="28" rx="14" fill="url(#badge-grad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="14" cy="14" r="4" fill="#10b981"/>
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.2">ENTERPRISE ZERO-TRUST RUNTIME</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" fill="url(#title-grad)" letter-spacing="-1.5">
      CHRONICLE
    </text>

    <!-- Subtitle -->
    <text x="2" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#f1f5f9" letter-spacing="0.2">
      Autonomous Action Control Plane for AI Agents
    </text>

    <text x="2" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="0.1">
      Behavior-Aware, Sequence-Aware Authorization &amp; Runtime Side-Effect Control Kernel
    </text>

    <!-- Bottom Feature Metric Chips -->
    <g transform="translate(0, 275)">
      <!-- Metric Chip 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="165" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10b981">⚡ 0.71ms</text>
        <text x="82" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">p50 Latency</text>
      </g>

      <!-- Metric Chip 2 -->
      <g transform="translate(177, 0)">
        <rect x="0" y="0" width="185" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">🛡️ 14/14 Neutralized</text>
        <text x="155" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b"></text>
      </g>

      <!-- Metric Chip 3 -->
      <g transform="translate(374, 0)">
        <rect x="0" y="0" width="170" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c084fc">🔐 RFC 8785</text>
        <text x="100" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">JCS + Ed25519</text>
      </g>

      <!-- Metric Chip 4 -->
      <g transform="translate(556, 0)">
        <rect x="0" y="0" width="175" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">⚖️ Lattice Monad</text>
        <text x="126" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">D_c ⊑ D_p</text>
      </g>
    </g>
  </g>
</svg>
